# =============================================================================
# ci.yml — CI: Test, Lint, Build
#
# Three-job pipeline: test (go test with race detector + vet), lint
# (golangci-lint), and build binary. Runs on pushes to main and on pull
# requests targeting main. The build job only runs on push to main.
#
# Trigger scope:
#   push to main; pull_request to main
#
# Secrets required: none
# =============================================================================
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests
        run: go test -v -race -count=1 ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -v -ldflags="-s -w" .

  lint:
    name: Lint
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=10m

  build:
    name: Build binary
    runs-on: self-hosted
    needs: [test, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Build
        run: go build -v -ldflags="-s -w" -o environments-server .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: environments-server
          path: environments-server
          retention-days: 7